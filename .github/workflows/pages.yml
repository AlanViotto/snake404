name: Publicar demo no GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - demo/**
      - dist/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        run: |
          mkdir -p _site/dist
          cp demo/index.html demo/demo.css _site/
          cp dist/snake404.js dist/snake404.css _site/dist/
          touch _site/.nojekyll
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
